server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_min_length 1024;
    # Prerendered HTML, hashed assets, discovery artifacts and plain-text
    # crawl files (llms.txt, robots.txt) are all compressed.
    gzip_types text/html text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # FastAPI: REST endpoints.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        # SSE (/api/analyses/{id}/stream) must not be buffered.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 2m;
    }

    # Health lives outside /api in the backend contract.
    location = /health {
        proxy_pass http://api:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        access_log off;
    }

    # Private application routes: always the noindex SPA shell (app.html),
    # served without redirecting so the URL (and ?next= query) stays.
    # Regex locations win over the prefix ones below; nothing else matches them.
    location ~ ^/(login|account|analyses|verify-email)(/.*)?$ {
        try_files /app.html =404;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache" always;
    }

    # The shell itself is never indexed either, even when linked directly.
    location = /app.html {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache" always;
    }

    # Discovery artifacts change rarely; a short cache beats no-cache here.
    location ~ ^/(sitemap\.xml|robots\.txt|llms\.txt)$ {
        add_header Cache-Control "public, max-age=3600";
    }

    # Hashed build output: content-addressed, so cache it forever.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # True 404s: unknown paths return 404.html with HTTP 404, never the home
    # page. The error page carries its own noindex header.
    error_page 404 /404.html;

    location = /404.html {
        internal;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache" always;
    }

    # Public static pages live next to the shell as one .html file per route.
    # Order: exact file -> .html sibling -> directory -> 404.
    # /features -> features.html with 200 and no trailing-slash redirect, so the
    # address matches the canonical URL.
    location / {
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }
}
