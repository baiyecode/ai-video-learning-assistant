name: ai-video-learning-assistant

services:
  api:
    build:
      context: ./backend
    environment:
      TZ: Asia/Shanghai
      APP_ENV: production
      APP_DEBUG: "false"
      APP_LOG_LEVEL: INFO
      # Set APP_SECRET_KEY (plus the APP_STRIPE_* trio and APP_SMTP_HOST/APP_SMTP_FROM
      # below) in a root .env file before deploying; the api refuses to start without them.
      APP_SECRET_KEY: ${APP_SECRET_KEY:-dev-only-change-me}
      APP_DATABASE_URL: sqlite+aiosqlite:////data/app.db
      APP_DATA_DIR: /data
      APP_MEDIA_ROOT: /media
      # Same-origin deployment: nginx (web) reverse-proxies /api and forwards the
      # original Host, so the browser never crosses an origin and this stays empty.
      # Local Vite development needs no entry either: its dev proxy also keeps the
      # browser's Host, so the API's own origin matches the browser's.
      APP_CORS_ORIGINS: "[]"
      # The compose stack is served over plain HTTP locally; set true behind HTTPS.
      APP_AUTH_COOKIE_SECURE: ${APP_AUTH_COOKIE_SECURE:-false}
      APP_DEEPSEEK_API_KEY: ${APP_DEEPSEEK_API_KEY:-}
      APP_DEEPSEEK_BASE_URL: ${APP_DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      APP_DEEPSEEK_MODEL: ${APP_DEEPSEEK_MODEL:-deepseek-chat}
      APP_DAILY_BUDGET_USD: ${APP_DAILY_BUDGET_USD:-10}
      # Free Analysis Quota per Account per Asia/Shanghai day. This is the single
      # repricing/re-quota knob: the same ${APP_ANALYSIS_DAILY_QUOTA} value is passed to
      # the web build below as VITE_ANALYSIS_DAILY_QUOTA, so the enforced limit and the
      # marketing/discovery copy (pricing page, sitemap, llms.txt) can never drift apart.
      APP_ANALYSIS_DAILY_QUOTA: ${APP_ANALYSIS_DAILY_QUOTA:-3}
      # Feature switch (ticket #23): Douyin parsing, off by default (P2-10 rollout doc
      # in docs/ops/douyin-gray-release.md explains how to open and roll back).
      APP_DOUYIN_ENABLED: ${APP_DOUYIN_ENABLED:-false}
      # Subscription billing (P2-01 / P2-10): production refuses to start while any of
      # these three is empty; the RuntimeError names the missing APP_STRIPE_* variable.
      APP_STRIPE_API_KEY: ${APP_STRIPE_API_KEY:-}
      APP_STRIPE_WEBHOOK_SECRET: ${APP_STRIPE_WEBHOOK_SECRET:-}
      APP_STRIPE_PRICE_ID: ${APP_STRIPE_PRICE_ID:-}
      # Display-only price for the pricing UI; the payment provider's checkout wins.
      # The same ${APP_SUBSCRIPTION_MONTHLY_USD} value is passed to the web build below
      # as VITE_SUBSCRIPTION_MONTHLY_USD, keeping backend and frontend on one source.
      APP_SUBSCRIPTION_MONTHLY_USD: ${APP_SUBSCRIPTION_MONTHLY_USD:-4.99}
      # Email verification (P2-05 / P2-10): APP_SMTP_HOST and APP_SMTP_FROM are
      # required in production; username/password stay optional for unauthenticated relays.
      APP_SMTP_HOST: ${APP_SMTP_HOST:-}
      APP_SMTP_PORT: ${APP_SMTP_PORT:-587}
      APP_SMTP_USERNAME: ${APP_SMTP_USERNAME:-}
      APP_SMTP_PASSWORD: ${APP_SMTP_PASSWORD:-}
      APP_SMTP_USE_TLS: ${APP_SMTP_USE_TLS:-true}
      APP_SMTP_FROM: ${APP_SMTP_FROM:-}
      APP_EMAIL_VERIFICATION_TOKEN_TTL_HOURS: ${APP_EMAIL_VERIFICATION_TOKEN_TTL_HOURS:-24}
      # Base of the verification-email links; must match the public web origin
      # (WEB_PORT above defaults to 8080; set a real domain behind HTTPS in production).
      APP_FRONTEND_BASE_URL: ${APP_FRONTEND_BASE_URL:-http://localhost:8080}
      # Per-Account hourly cap for verification resends (0 disables).
      APP_RATE_LIMIT_VERIFICATION_REQUEST_PER_HOUR: ${APP_RATE_LIMIT_VERIFICATION_REQUEST_PER_HOUR:-3}
      APP_RATE_LIMIT_VERIFICATION_CONFIRM_PER_HOUR: ${APP_RATE_LIMIT_VERIFICATION_CONFIRM_PER_HOUR:-10}
      # Optional error reporting: leave SENTRY_DSN empty to disable it.
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
    volumes:
      - app-data:/data
      - media:/media
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Daily logical backup of SQLite into its own volume. Runs the online backup API while
  # the API keeps writing; keeps BACKUP_RETENTION files (including the new one).
  backup:
    build:
      context: ./backend
    environment:
      TZ: Asia/Shanghai
      APP_DATABASE_URL: sqlite+aiosqlite:////data/app.db
      BACKUP_DIR: /backups
      BACKUP_RETENTION: ${BACKUP_RETENTION:-7}
    volumes:
      - app-data:/data
      - backups:/backups
    depends_on:
      api:
        condition: service_healthy
    command:
      - sh
      - -c
      - "while true; do python -m scripts.backup || true; sleep 86400; done"
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        # Public origin baked into canonical/OG/sitemap; must equal the public
        # https origin and match APP_FRONTEND_BASE_URL in production.
        VITE_SITE_ORIGIN: ${SITE_ORIGIN:-http://localhost:8080}
        # Single-source mirrors: same env vars the api service enforces, injected into
        # the frontend build so repricing/re-quota is one edit across backend + marketing.
        VITE_ANALYSIS_DAILY_QUOTA: ${APP_ANALYSIS_DAILY_QUOTA:-3}
        VITE_SUBSCRIPTION_MONTHLY_USD: ${APP_SUBSCRIPTION_MONTHLY_USD:-4.99}
    environment:
      TZ: Asia/Shanghai
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  app-data:
  media:
  backups:
