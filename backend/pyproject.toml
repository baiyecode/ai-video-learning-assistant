[project]
name = "ai-video-learning-assistant-backend"
version = "0.1.0"
description = "FastAPI backend for the AI video learning assistant"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20",
    "bcrypt>=5.0.0",
    "email-validator>=2.3.0",
    "fastapi>=0.115",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyjwt>=2.15.1",
    "sentry-sdk>=2.20",
    "sqlalchemy[asyncio]>=2.0.30",
    "tzdata>=2024.1",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1",
    "httpx>=0.27",
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 110
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]
